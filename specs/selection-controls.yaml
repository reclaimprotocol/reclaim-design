name: Selection controls
status: stable
components:
  - name: SegmentedControl
    purpose: Select exactly one exclusive view or scope.
    states: [default, selected, disabled]
    keyboard: [ArrowLeft, ArrowRight, Home, End]
  - name: Chip
    purpose:
      Show a tag or compact filter; dashed treatment represents add/create.
    states: [default, selected, disabled]
  - name: ChoiceRow
    purpose:
      Select one or many descriptive options with the entire row as target.
    variants: [single, multiple]
    semantics: 'Native radio/checkbox whenever possible.'
  - name: RadioCards
    purpose: Select one descriptive option from a small, visible set.
    states: [default, hover, focused, selected, disabled, invalid]
    semantics:
      'Use one fieldset, one legend, and one named group of native radio inputs.
      Keep the entire label as the target.'
  - name: PickerField
    purpose: Show the current rich selection and open a selection surface.
    states: [default, disabled]
    semantics: 'Label the field group and use a native button to open it.'
  - name: SelectionDialog
    purpose: Select one option from a responsive grid in a modal dialog.
    states: [default, selected, disabled]
    semantics: 'Use one named group of native radio inputs.'
accessibility:
  selected: 'Expose selected/checked state programmatically.'
  target:
    'Reach at least 44px touch target even when visual control is smaller.'
